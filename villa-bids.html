    if(!window.crypto||!crypto.subtle||typeof DecompressionStream==='undefined'){ask('이 브라우저에선 열 수 없어요. 브라우저를 최신으로 올려 주세요.');return;}
    var tries=fromLink?[fromLink,saved]:[saved];
    for(var i=0;i<tries.length;i++){
      if(!tries[i])continue;
      try{var html=await open(tries[i]); save(tries[i]); show(html); return;}catch(e){}
    }
    ask(fromLink||saved?'열쇠가 맞지 않아요.':'');
  })();
  document.getElementById('fm').addEventListener('submit',async function(e){
    e.preventDefault();
    var k=document.getElementById('ky').value.trim(); if(!k)return;
    try{var html=await open(k); save(k); show(html);}catch(err){ask('열쇠가 맞지 않아요.');}
  });
})();
