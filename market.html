<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light only">
<title>시장 온도계</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23191f28'/><polyline points='5,23 12,16 17,20 26,8' fill='none' stroke='%23fff' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='26' cy='8' r='3.6' fill='%23e34948'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f2f4f6;--card:#fff;--t1:#191f28;--t2:#4e5968;--t3:#8b95a1;--line:#e5e8eb;--grid:#eef0f3;
  --up:#e34948;--down:#2a78d6;--flat:#8b95a1;
  --s1:#2a78d6;--s2:#eb6834;--ink:#191f28;--soft:#f9fafb;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t1);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Roboto,sans-serif;
  word-break:keep-all;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.nw{white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 60px}
.head h1{font-size:21px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
.head .sub{font-size:12.5px;color:var(--t3);line-height:1.5}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.seg{display:inline-flex;background:#e9ecef;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--t2);cursor:pointer}
.seg button.on{background:#fff;color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--t2);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.lab{font-size:12px;color:var(--t3);font-weight:700;margin:14px 0 0}
.card{background:var(--card);border-radius:16px;padding:14px 14px 12px;margin:10px 0 0;box-shadow:0 1px 0 rgba(20,30,60,.04)}
.card.tap{cursor:pointer}
.card.tap:active{background:#fafbfc}
.rtop{display:flex;align-items:center;gap:10px}
.rname{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.rsido{font-size:11.5px;color:var(--t3);font-weight:700;margin-left:6px}
.rtop .spark{margin-left:auto;flex:0 0 auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;margin-top:10px}
.cell .k{font-size:11.5px;color:var(--t3);font-weight:600}
.cell .v{font-size:15px;font-weight:800;margin-top:2px;white-space:nowrap}
.cell .s{font-size:11.5px;color:var(--t3);margin-top:1px;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.muted{color:var(--t3)}
.hl{list-style:none;margin:0;padding:0}
.hl li{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--grid);font-size:14px}
.hl li:first-child{border-top:0}
.hl .t{flex:0 0 auto;width:86px;color:var(--t3);font-size:12.5px;font-weight:700}
.hl .ns{display:flex;flex-direction:column;gap:3px}
.hl a{color:inherit;text-decoration:none;font-weight:700}
.back{border:0;background:none;padding:6px 0;font-size:14px;font-weight:700;color:var(--t2);cursor:pointer}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.home{border:0;background:#eef1f4;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--t2);cursor:pointer;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:#fff;border-radius:14px;padding:11px 12px}
.tile .k{font-size:11.5px;color:var(--t3);font-weight:700}
.tile .v{font-size:17px;font-weight:800;margin-top:3px;white-space:nowrap}
.tile .s{font-size:11.5px;color:var(--t3);margin-top:2px;white-space:nowrap}
.ch h3{font-size:15px;margin:0;font-weight:800;display:flex;align-items:center;gap:6px}
.ch .cap{font-size:12px;color:var(--t3);margin-top:3px;line-height:1.5}
.plot{position:relative;margin-top:8px;touch-action:pan-y}
.plot svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#191f28;color:#fff;border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.55;white-space:nowrap;z-index:5;display:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip b{font-weight:800}
.legend{display:flex;gap:14px;font-size:12px;color:var(--t2);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
  background:#eef1f4;color:var(--t2);font-size:11px;font-weight:800;cursor:pointer;border:0;padding:0;flex:0 0 auto}
.pop{position:absolute;z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);
  padding:10px 12px;font-size:12.5px;line-height:1.6;color:var(--t2);width:min(300px,calc(100vw - 32px));font-weight:500}
.pop div{padding-left:.9em;text-indent:-.9em}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--grid);font-size:14px;cursor:pointer}
.row:first-child{border-top:0}
.row .a{min-width:0}
.row .a .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a .m{font-size:12px;color:var(--t3);margin-top:2px}
.row .b{text-align:right;flex:0 0 auto}
.row .b .p{font-weight:800;white-space:nowrap}
.row .b .m{font-size:12px;margin-top:2px;white-space:nowrap}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.empty{padding:18px 4px;color:var(--t3);font-size:13.5px;line-height:1.6}
.more{display:block;width:100%;margin-top:8px;border:0;background:#f2f4f6;border-radius:10px;padding:10px;font-size:13.5px;font-weight:700;color:var(--t2);cursor:pointer}
.foot{font-size:11.5px;color:var(--t3);line-height:1.7;margin-top:22px}
/* 🗺 후보 지도(11/2) */
.hmc{padding:8px}
.hmap{height:62vh;min-height:340px;border-radius:12px;overflow:hidden;background:#e8ecef}
.hmc .legend{padding:2px 6px 4px;gap:10px}
.hpin{font-size:12px;font-weight:800;color:#fff;background:var(--ink);border-radius:8px;padding:3px 7px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.hmap.leaflet-container{font-family:inherit}
.hpop{font-size:13px;line-height:1.5;min-width:180px;word-break:keep-all}
.hpop b{font-size:14px}
.hpop .go{display:inline-block;margin-top:2px;padding:7px 0;font-weight:800;color:var(--s1)}
/* 📊 흐름 비교(11/2) */
.cchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.cml{margin-top:6px}
.cmr{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.cmr:first-child{border-top:0}
.cmr>i{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin-top:5px}
.cmb{flex:1 1 auto;min-width:0}
.cmb .nm{font-size:14px;font-weight:800;color:var(--t1)}
.cmb .vs{font-size:12.5px;color:var(--t2);margin-top:2px;word-break:keep-all}
.cmr .x{flex:0 0 auto;border:0;background:var(--soft);border-radius:8px;width:28px;height:28px;color:var(--t3);font-weight:800;cursor:pointer}
.cmpadd{display:block;width:100%;margin-top:8px;font:inherit;font-size:13.5px;font-weight:700;color:var(--t2);border:1.5px dashed var(--line);border-radius:10px;padding:9px 10px;background:#fff}
@media(min-width:620px){.tiles{grid-template-columns:repeat(6,1fr)}}
@media(max-width:419px){.tiles.two{grid-template-columns:repeat(2,1fr)}}
.hentry{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:800;color:var(--t1);cursor:pointer}
.cond{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px;margin-top:4px}
.cond label{font-size:12px;color:var(--t3);font-weight:700;display:flex;flex-direction:column;gap:4px}
.cond select{font:inherit;font-size:14px;font-weight:700;color:var(--t1);border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff;width:100%}
.saved{font-size:12px;color:var(--t3);margin-top:8px;min-height:1em}
.nv+.nv{margin-left:6px}
/* ⭐ 관심 단지(11/3) — 단지 화면 단추 · 지도 별 */
.wst{display:inline-block;margin:8px 0 0 6px;padding:7px 12px;border-radius:999px;border:1.5px solid #e2b007;color:#a87e00;background:#fff;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.wst.on{background:#fff4c7}
.wmsg{font-size:12px;color:var(--t2);margin-top:6px;line-height:1.5}
.wpin{font-size:17px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
/* 📈 부동산원 주간(11/4) */
.rebt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.rebt th,.rebt td{padding:6px 2px;text-align:right;white-space:nowrap}
.rebt thead th{font-size:11.5px;color:var(--t3);font-weight:700}
.rebt tbody th{text-align:left;font-weight:800;color:var(--t1)}
.rebt tbody tr{border-top:1px solid var(--line)}
.rsig{font-size:12.5px;font-weight:700;color:var(--t2);margin-top:2px}
/* 🔨 지금 경매 중(11/3) */
.auc{border:1.5px solid #f2c94c}
.auc h3{font-size:15px;margin:0 0 2px;font-weight:800}
.arow{padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.55}
.auc h3+.arow{border-top:0}
.auc .cap{font-size:12px;color:var(--t3);margin-top:6px;line-height:1.5}
.arow .rk{font-size:12.5px;color:#b45309;font-weight:700}
.aust{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-size:13.5px;line-height:1.6;word-break:keep-all}
.aust .k{font-weight:800;margin-bottom:2px}
.aust .m{font-size:12.5px;color:var(--t2)}
.arow .m{font-size:12.5px;color:var(--t2)}
.nv.ak{border-color:#e2a400;color:#a87e00}
.apin{font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.hentry+.hentry{margin-left:6px}
/* 📈 시장 온도계 ↔ 🏠 내 집 후보 — 두 화면 맨 위에 나란히(11/3 사장님 '둘 다 띄워 줘'), 아래 글과 띄움 */
.vtabs{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.vtab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:14px;font-weight:800;color:var(--t2);cursor:pointer;white-space:nowrap}
.vtab.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* ❓ 사용법 창(11/3) — 폰은 아래에서 올라오는 판, PC 는 가운데 */
.vtabs .hlp{margin-left:auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;width:38px;height:38px;font-size:16px;cursor:pointer;flex:0 0 auto}
.hmodal{position:fixed;inset:0;z-index:3000;background:rgba(20,25,35,.45);display:flex;align-items:flex-end;justify-content:center}
.hmodal .hbox{background:#fff;width:100%;max-width:560px;max-height:86vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 18px 26px;box-shadow:0 -6px 24px rgba(0,0,0,.18)}
@media(min-width:761px){.hmodal{align-items:center}.hmodal .hbox{border-radius:18px}}
.hbox .ht{display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:800;margin-bottom:4px}
.hbox .hx{border:0;background:var(--soft);border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
.hbox h4{font-size:14.5px;margin:14px 0 4px;color:var(--t1)}
.hbox ul{margin:0;padding-left:18px}
.hbox li{font-size:13.5px;line-height:1.6;color:var(--t2);margin:2px 0;word-break:keep-all}
.nv{display:inline-block;margin-top:8px;padding:7px 12px;border-radius:999px;border:1.5px solid #03c75a;color:#03c75a;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.askrow{display:flex;gap:6px;margin-top:10px}
.askrow input{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:700;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.askrow select{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;background:#fff}
.askgo{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer}
.askout{margin-top:10px;font-size:13.5px;line-height:1.7}
.askout .verd{font-size:16px;font-weight:800;margin-bottom:4px}   /* 단지 화면은 '7억 1,500만'처럼 길어 360폭 3열에 안 들어간다 */
/* 🗺 지도 + 목록 시트(11/3 사장님 '경매 페이지처럼') — PC: 지도 반·목록 반 / 폰: 지도 + 아래서 올라오는 시트(손잡이로 접기·반·전체) */
.mmap,.sheet-handle{display:none}
body.mapmode .mmap{display:block;background:#e8ecef}
body.mapmode .mmap.leaflet-container{font-family:inherit}
/* 바탕 지도는 옅은 회색(11/3 사장님 — 경매 사이트 지도처럼 차분하게). 한강만 살짝 푸르게 남고, 색 점은 위 칸이라 그대로 */
body.mapmode .mmap .leaflet-tile-pane{filter:grayscale(.85) brightness(1.08) contrast(.88)}
.mleg{background:rgba(255,255,255,.95);border-radius:10px;padding:6px 10px;font-size:11.5px;color:var(--t2);box-shadow:0 1px 4px rgba(0,0,0,.18);line-height:1.7;word-break:keep-all}
.mleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 7px;vertical-align:-1px}
.mleg i:first-of-type{margin-left:0}
.mleg b{margin-right:6px}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:#fff4cc}100%{background:transparent}}
@media(min-width:761px){
  body.mapmode .msplit{display:flex;align-items:flex-start}
  body.mapmode .mmap{flex:0 0 52%;position:sticky;top:0;height:100vh}
  body.mapmode .msheet{flex:1 1 auto;min-width:0}
}
@media(max-width:760px){
  body.mapmode{height:100dvh;overflow:hidden}
  body.mapmode .msplit{display:flex;flex-direction:column;height:100dvh}
  body.mapmode .mmap{flex:1 1 auto;min-height:0}
  body.mapmode .msheet{flex:0 0 auto;height:46vh;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -6px 22px rgba(20,30,60,.16);
    overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;position:relative;z-index:900;transition:height .26s cubic-bezier(.4,0,.2,1)}
  body.mapmode .sheet-handle{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;background:var(--bg);padding:9px 16px 7px;z-index:5;touch-action:none;cursor:grab}
  body.mapmode .sheet-handle .grab{width:38px;height:5px;border-radius:3px;background:#cfd6de;align-self:center}
  body.mapmode .sheet-handle .lbl{font-size:13.5px;font-weight:800;color:var(--t1)}
  body.mapmode .sheet-handle .lbl span{color:var(--t3);font-weight:600}
  body.mapmode .msheet .wrap{padding-top:0}
  body.mapmode .msheet .head h1{display:none}   /* 손잡이 이름표가 제목을 대신(빌라 페이지처럼) */
}
</style>
</head>
<body>
<!-- 시장 온도계는 경매 사이트 탭 줄 없이 따로 둔다(11/1 사장님 '경매와 별도로') -->
<div class="msplit"><div class="mmap" id="mmap"></div><div class="msheet" id="msheet"><div class="sheet-handle" id="mhd"><div class="grab"></div><div class="lbl" id="mlbl"></div></div><div class="wrap" id="app"><div class="empty">불러오는 중…</div></div></div></div>
<script src="sheetdb.js"></script>   <!-- 🏠 내 집 후보 조건(예산·근무지)은 구글 시트에만 — 공개 파일엔 없음 -->
<script>
'use strict';
const BASE = 'market/';
let SUM = null;                       // summary.json
let WEEK;                              // week.json(📰 이번 주 신고분) — 없으면 null
let AUC;                               // auction.json(🔨 지금 경매 중, 매일 09:30) — 없으면 null
let REBN, REB;                         // 📈 부동산원 주간(11/4): reb_now.json(첫 화면, 작음) · reb.json(차트 — 필요할 때만 받음, 320KB)
async function rebFull(){ if(REB===undefined){ try{ REB=await getJSON(BASE+'reb.json'); }catch(e){ REB=null; } } return REB; }
// 주간 변화는 0.0x% 라 소수 둘째 자리까지(pct 는 0.05% 아래를 0으로 접는다)
const wp = x => x==null ? '<span class="muted">–</span>' : `<span class="${Math.abs(x)<0.00005?'flat':x>0?'up':'down'} nw">${Math.abs(x*100)<0.005?'0.00%':(x>0?'+':'△')+Math.abs(x*100).toFixed(2)+'%'}</span>`;
// 파일은 하루 한 번(09:30) 만든다 — 그 사이 입찰일이 지난 건은 화면에서 뺀다(11/4 QA)
const aucToday = () => { const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); };
const aucOf = k => { const t=aucToday(); return ((AUC&&AUC.items&&AUC.items[k])||[]).filter(x=>String(x.s)>=t); };
const aucIn = code => { if(!AUC||!AUC.items) return 0; let n=0; for(const k in AUC.items) if(k.startsWith(code+'|')) n+=aucOf(k).length; return n; };
const sdK = s => s&&s.length===8 ? (+s.slice(4,6))+'/'+(+s.slice(6,8)) : '';
// 지도 창 — 그 단지 경매들(입찰 빠른 순) + 단지 보기 · 경매 보기
function aucPop(r, au){ return `<div class="hpop"><b>🔨 ${esc(r[3])}</b><br>`
  +au.map(x=>`${sdK(x.s)} 입찰 · 최저 <b>${man(x.b/1e4)}</b>${x.f?` · 유찰 ${x.f}회`:''}`).join('<br>')
  +`<br><a href="#" class="go" data-go="${r[0]}|${esc(r[1])}|${esc(r[2])}|">단지 보기 →</a>`
  +(au[0].u?` <a href="#" class="go" data-nm="${esc(au[0].u)}">경매 보기 →</a>`:'')+`</div>`; }
const aucMark = (L, lay, r, au) => L.marker([r[5],r[4]],{icon:L.divIcon({className:'', html:'<span class="apin">🔨</span>', iconSize:null, iconAnchor:[-2,18]}), zIndexOffset:800})
  .bindPopup(aucPop(r, au)).addTo(lay);
const DET = {};                       // 구코드 → 상세 json

function man(v){ if(v==null) return '–'; v=Math.round(v); const e=Math.floor(v/10000), r=v%10000;

function pct(x,d=1){ if(x==null||isNaN(x)) return '–'; const v=x*100; if(Math.abs(v)<0.05) return '0.0%';
  return v>0 ? '+'+v.toFixed(d)+'%' : '△'+Math.abs(v).toFixed(d)+'%'; }

function go(ch){ if('r' in ch || 'd' in ch){ st.all=false; st.wall=false; } Object.assign(st, ch); const p=new URLSearchParams();
  if(st.k!=='apt') p.set('k',st.k); if(st.f!=='전체') p.set('f',st.f); if(st.o!==defO(st.k)) p.set('o',st.o);
  for(const k of ['v','r','d','x','a']) if(st[k]) p.set(k,st[k]);

// ── 차트(손으로 그린 SVG) ─────────────────────────────────────
function niceTicks(lo, hi, n=4){
  if(lo===hi){ lo-=1; hi+=1; }
  const raw=(hi-lo)/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/mag;
  const step=(f<1.5?1:f<3?2:f<7?5:10)*mag, out=[];
  const top=Math.ceil(hi/step-1e-9)*step;
  for(let v=Math.floor(lo/step+1e-9)*step; v<=top+1e-9; v+=step) out.push(+v.toFixed(10));
  return out;
}
function frame(el, h){ const w=Math.max(260, el.clientWidth); return {w, h, l:40, r:10, t:14, b:24}; }
function yearTicks(xs, xOf){ // xs: YYYYMM 목록
  return xs.map((m,i)=>m.endsWith('01') ? `<text x="${xOf(i)}" y="__B__" text-anchor="middle">${m.slice(0,4)}</text><line x1="${xOf(i)}" x2="${xOf(i)}" y1="__T__" y2="__B0__" stroke="var(--grid)"/>` : '').join('');
}
function attachTip(plot, svg, fr, n, xOf, html, mark){
  const tip=plot.querySelector('.tip');
  const cross=svg.querySelector('.cross');
  function at(clientX){
    const r=svg.getBoundingClientRect(); const x=(clientX-r.left)*fr.w/r.width;
    let best=-1, bd=1e9; for(let i=0;i<n;i++){ const h=html(i); if(h==null) continue; const d=Math.abs(xOf(i)-x); if(d<bd){bd=d;best=i;} }
    if(best<0) return hide();
    tip.innerHTML=html(best); tip.style.display='block';
    const px=xOf(best)*r.width/fr.w; const tw=tip.offsetWidth;
    tip.style.left=Math.max(0, Math.min(px-tw/2, r.width-tw))+'px'; tip.style.top='-6px'; tip.style.transform='translateY(-100%)';
    if(cross){ cross.setAttribute('x1',xOf(best)); cross.setAttribute('x2',xOf(best)); cross.style.display=''; }
    if(mark) mark(best);
  }
  function hide(){ tip.style.display='none'; if(cross) cross.style.display='none'; if(mark) mark(-1); }
  svg.addEventListener('pointermove', e=>at(e.clientX));
  svg.addEventListener('pointerdown', e=>at(e.clientX));
  svg.addEventListener('pointerleave', hide);
}
function lineChart(el, xs, ys, o={}){
  const fr=frame(el, o.h||190), {w,h,l,r,t,b}=fr;
  const vals=ys.filter(v=>v!=null); if(vals.length<2){ el.innerHTML='<div class="empty">표본이 적어 흐름을 그리지 않아요.</div>'; return; }
  const rv=o.ref?o.ref.ys.filter(v=>v!=null):[];       // 위 단계 흐름(구 화면 = 시도 전체, 동 화면 = 구 전체) — 회색 점선(11/2)
  let lo=Math.min(...vals,...rv), hi=Math.max(...vals,...rv); const pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad;
  if(o.floor!=null&&lo<o.floor) lo=o.floor;                          // 비율 차트는 0% 아래로 안 내려가게
  const ticks=niceTicks(lo,hi,4); lo=Math.min(lo,ticks[0]); hi=Math.max(hi,ticks[ticks.length-1]);
  const xOf=i=>l+(w-l-r)*i/(xs.length-1), yOf=v=>t+(h-t-b)*(1-(v-lo)/(hi-lo));
  const pathOf=a=>{ let d='', pen=false; a.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+xOf(i).toFixed(1)+' '+yOf(v).toFixed(1); pen=true; }); return d; };
  const d=pathOf(ys);
  const grid=ticks.map(v=>`<line x1="${l}" x2="${w-r}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="var(--grid)"/><text x="${l-6}" y="${yOf(v)+4}" text-anchor="end">${(o.fmtAxis||(x=>x))(v)}</text>`).join('');
  const yt=yearTicks(xs,xOf).replaceAll('__B__',h-6).replaceAll('__T__',t).replaceAll('__B0__',h-b);
  let marks='';
  for(const m of (o.marks||[])){ const x=xOf(m.i), y=yOf(ys[m.i]); const anchor = x>w*0.7?'end':(x<w*0.3?'start':'middle');
    marks+=`<circle cx="${x}" cy="${y}" r="4.5" fill="var(--ink)" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y-10}" text-anchor="${anchor}" fill="var(--t1)" font-weight="700">${m.label}</text>`; }
  const li=ys.length-1;
  el.innerHTML=`<div class="plot"><svg viewBox="0 0 ${w} ${h}" height="${h}" font-size="11" fill="var(--t3)">${grid}${yt}
    <line class="cross" y1="${t}" y2="${h-b}" stroke="var(--t3)" stroke-width="1" style="display:none"/>
    ${o.ref?`<path d="${pathOf(o.ref.ys)}" fill="none" stroke="#a3acb6" stroke-width="1.6" stroke-dasharray="4 3" stroke-linejoin="round"/>`:''}
    <path d="${d}" fill="none" stroke="${o.color||'var(--s1)'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${ys[li]!=null?`<circle cx="${xOf(li)}" cy="${yOf(ys[li])}" r="4" fill="${o.color||'var(--s1)'}" stroke="#fff" stroke-width="2"/>`:''}
    <circle class="dot" r="5" fill="${o.color||'var(--s1)'}" stroke="#fff" stroke-width="2" style="display:none"/>
    ${marks}<rect x="${l}" y="${t}" width="${w-l-r}" height="${h-t-b}" fill="transparent"/></svg><div class="tip"></div></div>
    ${o.ref?`<div class="legend"><span><i style="background:${o.color||'var(--s1)'}"></i>${esc(o.name||'')}</span><span><i style="background:#a3acb6"></i>${esc(o.ref.name)}</span></div>`:''}`;
  const plot=el.querySelector('.plot'), svg=plot.querySelector('svg'), dot=svg.querySelector('.dot');
  attachTip(plot, svg, fr, xs.length, xOf, i=> ys[i]==null?null:o.tip(i), i=>{ if(i<0||ys[i]==null){dot.style.display='none';return;} dot.setAttribute('cx',xOf(i)); dot.setAttribute('cy',yOf(ys[i])); dot.style.display=''; });
}
// 📊 여러 줄(흐름 비교, 11/2) — series: [{name,color,ys}] · 100 기준 점선 · 손가락 대면 그 달 값 전부
function multiLine(el, xs, series, o={}){
  const fr=frame(el, o.h||210), {w,h,l,r,t,b}=fr;
  const B=o.base===undefined?100:o.base, U=o.unit||'';            // 기준 점선(가격 100 · 거래량 0 · 비율은 없음)
  const vals=series.flatMap(s=>s.ys.filter(v=>v!=null)); if(vals.length<2){ el.innerHTML='<div class="empty">그릴 흐름이 없어요.</div>'; return; }
  let lo=Math.min(...vals,...(B==null?[]:[B])), hi=Math.max(...vals,...(B==null?[]:[B])); const pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad;
  if(o.floor!=null&&lo<o.floor) lo=o.floor;
  const ticks=niceTicks(lo,hi,4); lo=Math.min(lo,ticks[0]); hi=Math.max(hi,ticks[ticks.length-1]);
  const xOf=i=>l+(w-l-r)*i/(xs.length-1), yOf=v=>t+(h-t-b)*(1-(v-lo)/(hi-lo));
  const grid=ticks.map(v=>`<line x1="${l}" x2="${w-r}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="var(--grid)"/><text x="${l-6}" y="${yOf(v)+4}" text-anchor="end">${Math.round(v)}${U}</text>`).join('');
  // 1년(13달)은 1월 눈금이 하나뿐이라 석 달마다 'YY.MM'
  const yt=(o.xt?o.xt.map(([i,tx])=>`<text x="${xOf(i)}" y="__B__" text-anchor="${i?'middle':'start'}">${tx}</text>`).join(''):xs.length>14?yearTicks(xs,xOf):xs.map((m,i)=>i%3===0?`<text x="${xOf(i)}" y="__B__" text-anchor="${i?'middle':'start'}">${ymS(m)}</text>`:'').join(''))
    .replaceAll('__B__',h-6).replaceAll('__T__',t).replaceAll('__B0__',h-b);

function barChart(el, xs, ys, o={}){

  const yt=yearTicks(xs,i=>l+bw*i).replaceAll('__B__',h-6).replaceAll('__T__',t).replaceAll('__B0__',h-b);

    const rr=Math.min(2, ww/2, hh); return hh>0?`<path class="bb" data-i="${i}" d="M${x} ${h-b}V${y+rr}Q${x} ${y} ${x+rr} ${y}H${x+ww-rr}Q${x+ww} ${y} ${x+ww} ${y+rr}V${h-b}Z" fill="${o.color||'#86b6ef'}"/>`:''; }).join('');
  el.innerHTML=`<div class="plot"><svg viewBox="0 0 ${w} ${h}" height="${h}" font-size="11" fill="var(--t3)">${grid}${yt}${bars}
    <rect x="${l}" y="${t}" width="${w-l-r}" height="${h-t-b}" fill="transparent"/></svg><div class="tip"></div></div>`;
  const plot=el.querySelector('.plot'), svg=plot.querySelector('svg'); let prev=null;
  attachTip(plot, svg, fr, n, xOf, i=>o.tip(i), i=>{ if(prev) prev.setAttribute('fill',o.color||'#86b6ef'); prev=null;
    if(i>=0){ prev=svg.querySelector(`.bb[data-i="${i}"]`); if(prev) prev.setAttribute('fill','var(--s1)'); } });
}
function scatter(el, series, o={}){
  // series: [{name,color,pts:[[day,val,...]]}]
  const fr=frame(el, o.h||230), {w,h,l,r,t,b}=fr; fr.l=46;
  const all=series.flatMap(s=>s.pts); if(!all.length){ el.innerHTML='<div class="empty">거래가 없어요.</div>'; return; }
  const d0=0, d1=Math.max(...all.map(p=>p[0]))+20;
  let lo=Math.min(...all.map(p=>p[1])), hi=Math.max(...all.map(p=>p[1])); const pad=(hi-lo)*0.08||hi*0.05; lo=Math.max(0,lo-pad); hi+=pad;
  const ticks=niceTicks(lo,hi,4); lo=Math.min(lo,ticks[0]); hi=Math.max(hi,ticks[ticks.length-1]);
  const L=46, xOf=d=>L+(w-L-r)*(d-d0)/(d1-d0), yOf=v=>t+(h-t-b)*(1-(v-lo)/(hi-lo));
  const grid=ticks.map(v=>`<line x1="${L}" x2="${w-r}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${yOf(v)+4}" text-anchor="end">${eok(v)}</text>`).join('');
  let yt=''; for(let y=2021;y<=2030;y++){ const dd=(Date.UTC(y,0,1)-Date.UTC(2021,0,1))/864e5; if(dd>d1) break;
    yt+=`<line x1="${xOf(dd)}" x2="${xOf(dd)}" y1="${t}" y2="${h-b}" stroke="var(--grid)"/><text x="${xOf(dd)+3}" y="${h-6}">${y}</text>`; }
  const dots=series.map((s,si)=>s.pts.map((p,pi)=>`<circle data-s="${si}" data-p="${pi}" cx="${xOf(p[0]).toFixed(1)}" cy="${yOf(p[1]).toFixed(1)}" r="${s.r||3.5}" fill="${s.color}" fill-opacity="${s.op||.8}" stroke="#fff" stroke-width="1"/>`).join('')).join('');
  el.innerHTML=`<div class="plot"><svg viewBox="0 0 ${w} ${h}" height="${h}" font-size="11" fill="var(--t3)">${grid}${yt}${dots}
    <circle class="ring" r="7" fill="none" stroke="var(--ink)" stroke-width="2" style="display:none"/></svg><div class="tip"></div></div>
    <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name} ${s.pts.length.toLocaleString()}건</span>`).join('')}</div>`;
  const plot=el.querySelector('.plot'), svg=plot.querySelector('svg'), tip=plot.querySelector('.tip'), ring=svg.querySelector('.ring');

    let best=null, bd=22*22; series.forEach((s,si)=>s.pts.forEach((p,pi)=>{ const dx=xOf(p[0])-x, dy=yOf(p[1])-y, dd=dx*dx+dy*dy; if(dd<bd){bd=dd;best=[si,pi];} }));
    if(!best){ tip.style.display='none'; ring.style.display='none'; return; }
    const s=series[best[0]], p=s.pts[best[1]]; tip.innerHTML=o.tip(s,p); tip.style.display='block';
    const px=xOf(p[0])*R.width/w, py=yOf(p[1])*R.height/h, tw=tip.offsetWidth;
    tip.style.left=Math.max(0,Math.min(px-tw/2,R.width-tw))+'px'; tip.style.top=(py-12)+'px'; tip.style.transform='translateY(-100%)';
    ring.setAttribute('cx',xOf(p[0])); ring.setAttribute('cy',yOf(p[1])); ring.style.display=''; }
  svg.addEventListener('pointermove', at); svg.addEventListener('pointerdown', at);
  svg.addEventListener('pointerleave', ()=>{ tip.style.display='none'; ring.style.display='none'; });
}
function spark(ys, c3){

}

const wchg=(a,k)=>{ if(!a) return null; let j=a.length-1; while(j>=0&&a[j]==null) j--; return j>=k&&a[j-k]!=null?a[j]/a[j-k]-1:null; };

// 📊 시장 신호(11/3) — 같은 지역들을 가격·거래량(작년 대비)·신고가 비율·전세가율로 바꿔 겹쳐 본다
const CM=[['','가격'],['vol','거래량'],['hi','🔥 신고가'],['jr','전세가율'],['rs','📈 주간 매매'],['rj','📈 주간 전세']];
function volYoy(v){ const n=v.length, o=new Array(n).fill(null);           // 최근 3개월 ÷ 작년 같은 3개월 − 1 (%)
  for(let i=14;i<n;i++){ const a=v[i]+v[i-1]+v[i-2], p=v[i-12]+v[i-13]+v[i-14]; if(p>=10) o[i]=Math.round((a/p-1)*1000)/10; } return o; }

function drawSig(app, S){ const box=app.querySelector('#c-cmp'), n=SUM.months.length;

// ── 🏠 내 집 후보(11/2 3단계) ────────────────────────────────
// 조건(예산·근무지·거리…)은 구글 시트 notes/home-conditions 에만. 공개 파일(homes.json)엔 시장 숫자만 있다.
let HOMES=null, COND=null, CDB=null, csave=null, CKEY=false, CBASE=null, cq=Promise.resolve();
// 🔑 두 번째 열쇠(11/2) — 조건은 개인 값이라 열쇠 있는 기기만 읽힌다. 열쇠 없는 기기는 시트에 안 쓴다(못 읽은 걸 빈 값으로 덮어쓰지 않게)
const canSave=()=>{ const S=window.SheetDB; return !!S&&(S.MOCK||(typeof S.hasKey==='function'?S.hasKey():true)); };   // 옛 sheetdb.js(열쇠 없던 판)면 예전처럼
const HB={59:9, 84:10};                       // homes.json 줄에서 평형대 칸 위치
function km(a,b){ const R=6371, t=x=>x*Math.PI/180, dl=t(b[1]-a[1]), dn=t(b[0]-a[0]);
  const h=Math.sin(dl/2)**2+Math.cos(t(a[1]))*Math.cos(t(b[1]))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const walkMin = m => m==null?null:Math.max(1,Math.round(m*1.3/67));   // 직선거리 → 도보 분(어림)
async function loadCond(){
  if(COND===null){
    try{ CDB=await SheetDB.use(); CKEY=!!CDB&&canSave(); const s=CDB?await CDB.doc('notes/home-conditions').get():null; COND=(s&&s.exists)?(s.data()||{}):{}; }
    catch(e){ COND={}; }
    CBASE=JSON.parse(JSON.stringify(COND));
  }
  return COND;
}
async function loadHome(){
  if(!HOMES) HOMES=await getJSON(BASE+'homes.json');
  await loadSubway();
  await loadCond();
}
// 저장 = 직전에 시트를 다시 읽고 이 기기가 바꾼 칸만 얹기(11/4 QA) — 폰·PC·노트북이 옛 값으로 서로 덮어쓰지 않게.
// 다시 읽기가 실패했거나 열쇠 읽기가 막혀 공개 보기로 넘어갔으면(개인 문서가 안 보임) 저장하지 않는다 — 빈 값으로 덮으면 조건이 통째로 지워진다.
async function freshRead(db){ const ok=await db.refresh(); if(SheetDB.MOCK) return;
  if(!ok||!(await db.doc('notes/home-conditions').get()).exists) throw new Error('시트에서 개인 값을 못 읽었어요. 잠시 뒤 다시 해 주세요'); }
const sameV=(a,b)=>JSON.stringify(a===undefined?null:a)===JSON.stringify(b===undefined?null:b);
function mergeCond(base, mine, now){ const out=Object.assign({}, now);
  for(const k of new Set([...Object.keys(base),...Object.keys(mine)])){
    if(sameV(mine[k],base[k])) continue;                // 이 기기가 안 바꾼 칸 — 시트 값 그대로
    if(k==='watch'){                                    // ⭐ 는 단지별로 — 내가 뺀 것만 빼고 내가 넣은 것만 더한다
      const ks=a=>new Set((a||[]).map(w=>w.k)), b=ks(base.watch), m=ks(mine.watch);
      const kept=(now.watch||[]).filter(w=>!(b.has(w.k)&&!m.has(w.k))), have=ks(kept);
      (mine.watch||[]).forEach(w=>{ if(!b.has(w.k)&&!have.has(w.k)) kept.push(w); });
      out.watch=kept; }
    else if(mine[k]===undefined) delete out[k];
    else out[k]=mine[k]; }
  return out; }
function saveCond(okText){ if(!CKEY) return;   // 열쇠 없는 기기 — 화면에서만 쓴다
  const el=document.getElementById('csaved'); if(el) el.textContent='저장 중…';
  clearTimeout(csave); csave=setTimeout(()=>{ cq=cq.then(()=>pushCond(okText)); }, 700); }   // 한 번에 하나씩(겹치면 다시 읽은 값이 앞선 저장을 놓친다)
async function pushCond(okText){ let now=null, msg=okText||'✓ 조건 저장됨(우리 구글 시트)';
  try{ if(!CDB) throw new Error('시트 연결 안 됨');
    const doc=CDB.doc('notes/home-conditions');
    await freshRead(CDB); const s=await doc.get(); now=(s.exists&&s.data())||{};
    const out=mergeCond(CBASE, COND, now), sent=JSON.stringify(out);
    let other=false;                                    // 다른 기기가 바꾼 값이 섞였으면 화면도 다시 그린다(안 바뀐 칸은 객체를 그대로 둔다 — 화면이 잡고 있다)
    for(const k of new Set([...Object.keys(COND),...Object.keys(out)])) if(!sameV(COND[k],out[k])){ if(k in out) COND[k]=out[k]; else delete COND[k]; other=true; }
    if(!sameV(now,out)) await doc.set(JSON.parse(sent));
    CBASE=JSON.parse(sent);
    if(other) await render();
  }catch(e){ if(now) CBASE=now; msg='저장 못 했어요 — '+e.message; }   // 못 보냈으면 시트는 아직 now — 다음 저장 때 내 변경을 다시 얹는다
  const e2=document.getElementById('csaved'); if(e2) e2.textContent=msg; }
// 🕒 출퇴근(지하철만, 어림 — 11/2) — 공개 파일 subway.json 엔 역·역 사이 분만 있고, 근무지 좌표는 시트에서 읽어 폰에서만 계산한다.
//  걸어서 역까지(직선×1.3, 분당 67m) + 처음 기다림 3분 + 역 사이(오픈스트리트맵 노선 순서, 거리로 어림 — market_subway.py) + 갈아타기 5분(GTX 8분) + 내려서 걸어서.
//  근무지·단지에서 1.2km 안 역만 쓴다(더 멀면 버스·차라 안 셈). 근무지가 1.5km 안이면 걸어서만.
let SUBW=null, CTK=null, CT=null;
const WAIT0=3, XFER=5, NEAR_M=1200;
const walkM = m => m*1.3/67;
async function loadSubway(){ if(SUBW===null){ try{ SUBW=await getJSON(BASE+'subway.json'); }catch(e){ SUBW=false; } } return SUBW||null; }
function nearSt(lng, lat){ const out=[], S=SUBW.st;
  for(let i=0;i<S.length;i++){ const x=S[i]; if(Math.abs(x[1]-lat)>0.012||Math.abs(x[2]-lng)>0.016) continue;
    const m=km([lng,lat],[x[2],x[1]])*1000; if(m<=NEAR_M) out.push([i,m]); }
  return out; }
function commuteTable(plan){            // 근무지 쪽에서 거꾸로 한 번 풀어 둔다(역마다 근무지까지 분)
  if(!SUBW||!plan) return null;
  const key=JSON.stringify(plan.pts||[]); if(CTK===key) return CT; CTK=key; CT=null;
  const n=SUBW.st.length, adj=Array.from({length:n},()=>[]);
  for(const [a,b,m,ln] of SUBW.e){ adj[a].push([b,m,ln]); adj[b].push([a,m,ln]); }
  const pq=[];
  const push=(t,s,ln)=>{ pq.push([t,s,ln]); let i=pq.length-1; while(i>0){ const p=(i-1)>>1; if(pq[p][0]<=pq[i][0]) break; [pq[p],pq[i]]=[pq[i],pq[p]]; i=p; } };
  const pop=()=>{ const top=pq[0], last=pq.pop(); if(pq.length){ pq[0]=last; let i=0;
    for(;;){ const l=2*i+1, r=l+1; let m=i; if(l<pq.length&&pq[l][0]<pq[m][0]) m=l; if(r<pq.length&&pq[r][0]<pq[m][0]) m=r; if(m===i) break; [pq[m],pq[i]]=[pq[i],pq[m]]; i=m; } }
    return top; };
  for(const p of (plan.pts||[])) for(const [i,m] of nearSt(p.lng,p.lat)) push(walkM(m), i, '');
  if(!pq.length) return null;          // 근무지 가까이 역이 없다(셔틀·차 출퇴근) — 지하철 시간은 안 셈
  const T=new Float64Array(n).fill(Infinity), done=new Set();
  while(pq.length){ const [t,s,ln]=pop(), k=s+'|'+ln; if(done.has(k)) continue; done.add(k); if(t<T[s]) T[s]=t;
    for(const [b,m,l2] of adj[s]) if(!done.has(b+'|'+l2)) push(t+m+(ln&&l2!==ln?((ln+l2).includes('GTX')?8:XFER):0), b, l2); }
  CT=T; return T;
}
function commuteOf(r, plan){            // homes.json 줄 → 분(어림) 또는 null(역이 멀어 안 셈)
  const T=commuteTable(plan); if(!T) return null;
  let best=null;
  for(const p of (plan.pts||[])){ const d=km([r[4],r[5]],[p.lng,p.lat])*1000; if(d<=1500){ const w=walkM(d); if(best==null||w<best) best=w; } }
  for(const [i,m] of nearSt(r[4],r[5])){ if(T[i]===Infinity) continue; const t=walkM(m)+WAIT0+T[i]; if(best==null||t<best) best=t; }
  return best==null?null:Math.round(best);
}
function homeRows(){
  const c=COND, plan=(c.plans||[])[c.plan||0]; if(!plan) return [];
  const pts=(plan.pts||[]).map(p=>[p.lng,p.lat,p.n]), out=[], yr=new Date().getFullYear();
  const bands=c.band==='59'?[59]:c.band==='84'?[84]:[59,84];
  for(const r of HOMES.rows){
    let best=null; for(const p of pts){ const d=km([r[4],r[5]],p); if(!best||d<best[0]) best=[d,p[2]]; }
    if(!best||best[0]>(plan.km||10)) continue;
    const w=walkMin(r[8]); if(c.walk&&(w==null||w>c.walk)) continue;
    // 버스: r[12] = 정류장 직선 m(-1 = 물어봤는데 가까이 없음, null = 아직 못 물음·인천) — 못 물은 곳은 거르지 않는다
    const bw=r[12]==null?null:(r[12]<0?99:walkMin(r[12])); if(c.bwalk&&bw!=null&&bw>c.bwalk) continue;
    if(c.age&&r[6]&&yr-r[6]>c.age) continue;
    const ct=commuteOf(r, plan); if(c.commute&&(ct==null||ct>c.commute)) continue;
    for(const bd of bands){ const b=r[HB[bd]]; if(!b||!b[0]) continue;
      if(c.budget&&b[0]>c.budget) continue; if((c.minN||0)>b[1]) continue;
      out.push({r, bd, b, dist:best[0], to:best[1], w, bw, ct}); }
  }
  const k=c.sort||'dist', f={dist:x=>x.dist, cheap:x=>x.b[0], deal:x=>-x.b[1], new:x=>-(x.r[6]||0), drop:x=>x.b[0]/x.b[2], time:x=>x.ct??999}[k]||(x=>x.dist);
  return out.sort((a,b)=>f(a)-f(b));
}

function setSheet(fr){ const sh=document.getElementById('msheet'); if(!sh) return; sh.style.height=(fr*100)+'vh'; setTimeout(()=>{ if(MAP) MAP.invalidateSize(); },300); }
(function(){ const sh=document.getElementById('msheet'), hd=document.getElementById('mhd'); if(!hd) return;
  const SNAP=[0.12,0.46,0.84]; let sy=null, h0=0, mv=false;
  const near=fr=>SNAP.reduce((a,b)=>Math.abs(b-fr)<Math.abs(a-fr)?b:a);
  hd.addEventListener('pointerdown',e=>{ sy=e.clientY; h0=sh.getBoundingClientRect().height; mv=false; sh.style.transition='none'; try{ hd.setPointerCapture(e.pointerId); }catch(_){} });
  hd.addEventListener('pointermove',e=>{ if(sy==null) return; const dy=sy-e.clientY; if(Math.abs(dy)>4) mv=true;
    sh.style.height=Math.max(innerHeight*0.09,Math.min(innerHeight*0.88,h0+dy))+'px'; });
  const up=()=>{ if(sy==null) return; const fr=sh.getBoundingClientRect().height/innerHeight; sy=null; sh.style.transition='';
    setSheet(!mv?(fr<0.28?0.46:0.12):near(fr)); };
  hd.addEventListener('pointerup',up); hd.addEventListener('pointercancel',up);
  window.addEventListener('resize',()=>{ if(!isMob()&&sh.style.height) sh.style.height=''; if(MAP) MAP.invalidateSize(); });
})();

// ── 💬 이 값이면 급매일까?(11/2 4단계) — 매물 사이트는 약관상 긁지 않는다. 본 값을 사람이 넣으면 우리 실거래와 견준다.
//    넣은 값은 구글 시트 notes/asks 에만(공개 파일엔 없음). 네이버 매물은 검색 창만 열어 준다(링크).
function parseAsk(t){ t=String(t||'').replace(/[,\s원]/g,'').replace(/만$/,''); if(!t) return null;
  // 억·천·백·만 단위를 다 읽는다('10억5천'·'12억 3천5백'·'5천'). 평·층·'매매' 같은 글자가 섞이면 읽지 않는다(null).
  // 11/4 조사: 전엔 '10억5천'이 10억으로 조용히 틀렸다(앞 숫자만 읽고 경고도 없었음)
  const u=(a,b,c,d)=>Math.round((a?+a*10000:0)+(b?+b*1000:0)+(c?+c*100:0)+(d?+d:0));
  let m=t.match(/^(\d+(?:\.\d+)?)억(?:(\d+)천)?(?:(\d+)백)?(\d+)?$/); if(m) return u(m[1],m[2],m[3],m[4]);
  m=t.match(/^(?:(\d+)천)?(?:(\d+)백)?(\d+)?$/); if(m&&(m[1]||m[2])) return u(0,m[1],m[2],m[3]);
  if(/[^\d.]/.test(t)) return null;
  const n=parseFloat(t); if(isNaN(n)||n<=0) return null;
  return n<1000?Math.round(n*10000):Math.round(n); }                 // 1000 미만은 억, 그 이상은 만원
function qtile(a,q){ const s=a.slice().sort((x,y)=>x-y); if(!s.length) return null; const i=(s.length-1)*q, lo=Math.floor(i), hi=Math.ceil(i); return s[lo]+(s[hi]-s[lo])*(i-lo); }
function judgeAsk(pts, ask, fl){
  // pts = [일수, 값, 층, 직거래, 신고가]. 기준 = 최근 3개월 거래(3건 안 되면 최근 6건)의 중위 — 값이 빨리 오르내리면
  //  1년 중위는 늦다(11/2 중계그린 49㎡: 1년 중위 6.4억 vs 최근 7.0~7.2억). 1년 거래는 참고로만.
  //  층대를 고르면 그 층대만(3건 안 되면 모든 층). 직거래는 뺀다.
  const all=pts.filter(p=>!p[3]); if(!all.length) return {n:0};
  const end=Math.max(...all.map(p=>p[0]));
  let pool=all, flNote='';
  if(fl){ const f=all.filter(p=>fl==='low'?(p[2]>=1&&p[2]<=3):p[2]>3); if(f.filter(p=>p[0]>end-365).length>=3) pool=f; else flNote='이 층대 거래가 적어 모든 층으로 봤어요'; }
  const yr=pool.filter(p=>p[0]>end-365), v=yr.map(p=>p[1]);
  const byNew=pool.slice().sort((a,b)=>b[0]-a[0]);
  let ref=byNew.filter(p=>p[0]>end-92), refWhat='최근 3개월';
  if(ref.length<3){ ref=byNew.filter(p=>p[0]>end-365).slice(0,6); refWhat='최근 거래'; }
  return {n:v.length, med:qtile(v,.5), cheaper:v.filter(x=>x<ask).length, top:Math.max(...all.map(p=>p[1])),
          ref:qtile(ref.map(p=>p[1]),.5), refN:ref.length, refWhat, recent:byNew.slice(0,3), flNote};
}
function askHtml(j, ask){
  if(!j.n) return '<div class="empty">최근 1년 거래가 없어 견줄 수 없어요.</div>';
  const L=[], r=j.ref?ask/j.ref-1:null;
  let verdict, cls2;
  if(j.refN<3){ verdict='최근 거래가 '+j.refN+'건뿐이라 판단하기 어려워요'; cls2='muted'; }
  else if(r<-0.4||r>0.6){ verdict='값을 다시 확인해 주세요(최근 거래와 너무 달라요)'; cls2='muted'; }   // 오타 대비
  else if(r<=-0.10){ verdict='🔥 급매 후보예요'; cls2='up'; }
  else if(r<=-0.03){ verdict='조금 싼 편이에요'; cls2=''; }
  else if(r<=0.05){ verdict='보통 값이에요'; cls2='muted'; }
  else { verdict='비싼 편이에요'; cls2='down'; }
  L.push(`<div class="verd ${cls2}">${verdict}</div>`);
  L.push(`<div>· ${nw(man(ask))}으로 봤어요</div>`);
  if(j.ref) L.push(`<div>· ${j.refWhat} ${j.refN}건 중위 ${nw(man(j.ref))}보다 ${pctH(r)}</div>`);
  L.push(`<div>· 최근 1년 ${j.n}건 중 ${j.cheaper}건이 이보다 쌌어요</div>`);
  L.push(`<div>· 최고가 ${nw(man(j.top))}보다 ${pctH(ask/j.top-1)}</div>`);
  if(j.flNote) L.push(`<div class="muted">· ${j.flNote}</div>`);
  if(j.recent.length) L.push(`<div class="muted">· 최근 거래: ${j.recent.map(p=>nw(dayK(p[0]).slice(2)+' '+man(p[1])+(p[2]!=null?' '+p[2]+'층':''))).join(' · ')}</div>`);
  return L.join('');
}

// 🔨 지금 경매 중(11/3) — 경매 사이트 목록(매일 아침)에서 이 단지와 구·동·지번이 같은 물건. 최저가를 최근 실거래 기준(💬 와 같은 셈)과 견줌
// 📊 지난 낙찰이 시세보다 얼마나 쌌나(11/4) — market_auction.sale_stats. 지역 낙찰이 적으면 수도권 전체. 숫자 근거는 인계 8장
function aucStat(sd){ const S=AUC&&AUC.st; if(!S||!S.all) return '';
  const a=(S.sido||{})[sd], m=a||S.all, base=(S.base_s||{})[a?sd:'']??S.base, P=x=>pct(x,1);
  return `<div class="aust"><div class="k">📊 지난 낙찰은 시세보다 얼마나 쌌나</div>`
    +`<div>${nw((a?sd:'수도권')+' '+m.n.toLocaleString()+'건')} · ${nw('중위 ')}${nw('<b>'+P(m.m)+'</b>')}</div>`
    +`<div class="m">${nw('가운데 절반 '+P(m.q1)+' ~ '+P(m.q3))}</div>`
    +(base!=null?`<div class="m">${nw('평범한 매매는 같은 기준으로 '+P(base))}</div>`:'')
    +((S.bid||[]).length?`<div class="m">응찰자 ${S.bid.map(b=>nw(b.k+' '+P(b.m))).join(' · ')}</div>`:'')
    +`<div class="cap">· 시세 = 입찰 전 6개월, 같은 단지·크기·층 묶음 실거래 중위<br>· 최근 1년 낙찰만 셌어요<br>· 대항력·선순위·지분 같은 권리 위험은 뺐어요<br>· 이긴 사람의 값이에요<br>· 내부 상태·명도 위험은 숫자에 없어요<br>· 응찰자 수는 입찰 전에 알 수 없어요</div></div>`; }
function aucCard(AU, PA, sd){ if(!AU.length) return '';
  return `<div class="card auc"><h3>🔨 지금 경매 중 ${AU.length}건</h3>`+AU.map(x=>{
    const bd=String(Math.floor(parseFloat(x.ar)||0)), pp=((PA[bd]||{}).p)||[], j=pp.length?judgeAsk(pp, Math.round(x.b/1e4), ''):null;
    const rt=j&&j.refN>=3&&j.ref?Math.round(x.b/1e4/j.ref*100):null;
    return `<div class="arow"><div><b>${nw(sdK(x.s)+' 입찰')}</b> · ${nw('최저 '+man(x.b/1e4))}${x.f?' '+nw('(유찰 '+x.f+'회)'):''}</div>`
      +`<div class="m">${nw('감정 '+man(x.a/1e4))} · ${nw(esc(x.ar))}</div>`
      +(rt?`<div class="m">${nw('최저가 = '+j.refWhat+' 실거래 중위 '+man(j.ref)+'의 '+rt+'%')}</div>`:'')
      +(x.r?`<div class="rk">⚠ ${esc(x.r)}<br>물어줄 돈이 따로 있을 수 있어요<br>아래 통계는 이런 물건을 뺀 값이에요</div>`:'')
      +(x.u?`<span class="nv ak" data-u="${esc(x.u)}">경매 보기 →</span>`:'')+`</div>`; }).join('')
    +aucStat(sd)
    +`<div class="cap">경매 사이트 목록(매일 아침)에서 이 단지와 동·지번이 같은 물건이에요.</div></div>`; }

    <div class="card ch"><h3>💬 이 값이면 급매일까?</h3><div class="cap">네이버 등에서 본 매물 값(호가)을 넣어 보세요<br>전용 ${b.a}㎡ 최근 실거래와 견줘요 · 넣은 값은 우리 구글 시트에만</div>
      <div class="askrow"><input id="askv" inputmode="decimal" placeholder="예: 9.5 (억)"><select id="askfl"><option value="">층 모름</option><option value="low">1~3층</option><option value="high">4층 이상</option></select><button class="askgo" id="askgo">판단</button></div>
      <div id="askout" class="askout"></div><div id="asklist"></div></div>`;
  app.querySelector('#bk').onclick=()=>go({x:null,a:null}); app.querySelector('#hm').onclick=()=>go({r:null,d:null,x:null,a:null});
  // ⭐ 관심 단지(11/3) — 시트 '내 집 조건' 문서의 watch 에 넣고 뺀다(개인 값 — 두 번째 열쇠). 새 실거래는 매일 09:30 개인 채팅으로
  { const el=app.querySelector('#wst'), k=`${st.r}|${c.umd}|${c.jibun}`;
    const paint=()=>{ const on=((COND&&COND.watch)||[]).some(w=>w.k===k); el.textContent=on?'★ 관심 단지':'☆ 관심'; el.classList.toggle('on',on); };
    loadCond().then(paint);
    el.onclick=async()=>{ await loadCond(); const msg=app.querySelector('#csaved');
      if(!CKEY){ msg.innerHTML='🔑 이 기기엔 두 번째 열쇠가 없어 관심 단지를 저장 못 해요<br>사장님 열쇠 링크를 이 기기에서 한 번 열어 주세요'; return; }
      const w=(COND.watch=COND.watch||[]), i=w.findIndex(x=>x.k===k);
      if(i>=0) w.splice(i,1); else w.push({k, n:c.name, g:g.n, at:new Date().toISOString().slice(0,19)});
      paint(); saveCond(i>=0?'관심 단지에서 뺐어요':'⭐ 관심 단지에 넣었어요 — 새 실거래가 신고되면 개인 채팅으로 알려 드려요'); }; }
  app.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>go({a:x.dataset.a}));
  { const key=`${st.r}|${c.umd}|${c.jibun}|${b.a}`, out=app.querySelector('#askout'), lst=app.querySelector('#asklist');
    const bindDel=()=>lst.querySelectorAll('[data-del]').forEach(x=>x.onclick=async()=>{ try{ lst.innerHTML=askListHtml(await askRemove(key, x.dataset.del)); bindDel(); }catch(e){ out.innerHTML='<div class="muted">시트에서 못 지웠어요('+esc(e.message)+')</div>'; } });
    askLoad().then(all=>{ lst.innerHTML=askListHtml(all[key]); bindDel(); });
    app.querySelector('#askgo').onclick=async()=>{ const v=parseAsk(app.querySelector('#askv').value), fl=app.querySelector('#askfl').value;
      if(!v){ out.innerHTML='<div class="muted">값을 숫자로 넣어 주세요(예: 9.5 = 9억 5천, 95000 = 만원).</div>'; return; }
      const j=judgeAsk(P.p, v, fl); out.innerHTML=askHtml(j, v);
      const verdict=(out.querySelector('.verd')||{}).textContent||'';
      try{ lst.innerHTML=askListHtml(await askSave(key, {v, fl, verdict, at:new Date().toISOString().slice(0,19)})); bindDel(); }
      catch(e){ out.insertAdjacentHTML('beforeend', e.code==='nokey'
        ?'<div class="muted">· 🔑 이 기기엔 두 번째 열쇠가 없어 시트에 안 적었어요<br>· 사장님 열쇠 링크를 이 기기에서 한 번 열면 적혀요</div>'
        :'<div class="muted">· 시트에 못 적었어요('+esc(e.message)+')</div>'); } }; }
  scatter(app.querySelector('#c-sc'), [
      // 그리는 순서 = 겹칠 때 위로 오는 순서(전세 → 직거래 → 매매 → 🔥 신고가)
      {name:'전세', color:'var(--s2)', pts:P.r, r:3, op:.6},
      {name:'직거래', color:'#b0b8c1', pts:P.p.filter(p=>p[3]), r:3},
      {name:'매매', color:'var(--s1)', pts:P.p.filter(p=>!p[3]&&!p[4])},
      {name:'🔥 신고가', color:'var(--ink)', pts:P.p.filter(p=>p[4]), r:5, op:1}].filter(s=>s.pts.length),   // 빨강은 주황 전세 점과 헷갈려 진한 검정(11/2)
    {tip:(s,p)=>`<b>${dayK(p[0])}</b><br>${s.name} ${man(p[1])}${p[2]!=null&&s.name!=='전세'?`<br>${p[2]}층`:''}${p[4]?'<br>그때까지 최고가':''}`});
}

async function render(){
  const app=document.getElementById('app');
  try{
    if(!SUM) SUM=await getJSON(BASE+'summary.json');
    if(WEEK===undefined){ try{ WEEK=await getJSON(BASE+'week.json'); }catch(e){ WEEK=null; } }
    if(AUC===undefined){ try{ AUC=await getJSON(BASE+'auction.json'); }catch(e){ AUC=null; } }
    if(REBN===undefined){ try{ REBN=await getJSON(BASE+'reb_now.json'); }catch(e){ REBN=null; } }
    if(!st.r && st.v==='home') await renderHome(app);
    else if(!st.r) renderList(app);
    else if(st.k==='apt' && st.d && st.x) await renderComplex(app);
    else if(st.d) await renderDong(app);
    else await renderRegion(app);
  }catch(e){ noMap(); app.innerHTML=`<div class="empty">자료를 못 불러왔어요.<br>잠시 뒤 새로고침해 주세요.<br><span class="muted">(${esc(e.message)})</span></div>`; }
}
readHash(); render();
</script>
