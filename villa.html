<script>
(function(){
  var STORE='sheetdb-k2-v1', box=document.getElementById('lockbox');
  function bin(s){var a=atob(s),u=new Uint8Array(a.length);for(var i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return u;}
  async function open(k){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(k),'HKDF',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:bin(box.dataset.s),info:enc.encode('auction-link-lock-v1')},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(box.dataset.i)},key,bin(box.textContent));
    return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  function show(html){document.open();document.write(html);document.close();}
  function save(k){try{localStorage.setItem(STORE,k);}catch(e){}}
  function ask(msg){
    document.getElementById('lk').hidden=false;
    var er=document.getElementById('er');
    er.hidden=!msg; er.textContent=msg||'';
  }
  var m=/(?:^#|&)k2=([A-Za-z0-9_\-]{16,})/.exec(location.hash||''), fromLink=m?m[1]:'';
  if(fromLink){
    var rest=(location.hash||'').replace(/(^#|&)k2=[^&]*/,'$1').replace(/^#&/,'#').replace(/&$/,'').replace(/^#$/,'');
    try{history.replaceState(null,'',location.pathname+location.search+rest);}catch(e){}
  }
  var saved=''; try{saved=localStorage.getItem(STORE)||'';}catch(e){}
  (async function(){
    if(!window.crypto||!crypto.subtle||typeof DecompressionStream==='undefined'){ask('이 브라우저에선 열 수 없어요. 브라우저를 최신으로 올려 주세요.');return;}
    var tries=fromLink?[fromLink,saved]:[saved];
    for(var i=0;i<tries.length;i++){
      if(!tries[i])continue;
      try{var html=await open(tries[i]); save(tries[i]); show(html); return;}catch(e){}
    }
    ask(fromLink||saved?'열쇠가 맞지 않아요.':'');
  })();
  document.getElementById('fm').addEventListener('submit',async function(e){
    e.preventDefault();
    var k=document.getElementById('ky').value.trim(); if(!k)return;
    try{var html=await open(k); save(k); show(html);}catch(err){ask('열쇠가 맞지 않아요.');}
  });
})();
</script></body></html>
